version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - gofmt
    - goimports
    - misspell
    - prealloc
    - unconvert
  settings:
    govet:
      enable:
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

issues:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic